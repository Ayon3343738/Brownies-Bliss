<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Brownies Bliss</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .admin-header h1 { font-size: 1.6rem; color: var(--brown); }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab-btn { padding: 10px 20px; border: 1px solid var(--border); background: white; border-radius: 999px; cursor: pointer; font-weight: 500; }
    .tab-btn.active { background: var(--brown); color: white; border-color: var(--brown); }
    .panel { display: none; }
    .panel.active { display: block; }
    .login-box { max-width: 360px; margin: 80px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
    .login-box input { width: 100%; padding: 12px; margin: 12px 0 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .order-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .order-id { font-size: 0.8rem; color: var(--muted); }
    .status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-confirmed { background: #dbeafe; color: #1e40af; }
    .status-preparing { background: #e0e7ff; color: #3730a3; }
    .status-out_for_delivery { background: #fce7f3; color: #9d174d; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .order-customer { font-weight: 600; margin: 6px 0 2px; }
    .order-meta { font-size: 0.9rem; color: var(--muted); }
    .order-items { margin: 10px 0; font-size: 0.9rem; }
    .order-total { font-weight: 700; color: var(--brown); margin-top: 8px; }
    .status-select { margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .product-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; box-shadow: var(--shadow); gap: 12px; flex-wrap: wrap; }
    .product-info h4 { margin-bottom: 2px; }
    .product-info span { font-size: 0.85rem; color: var(--muted); }
    .product-actions { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .btn-edit { background: #e0e7ff; color: #3730a3; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .form-card { background: white; padding: 24px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .form-card h3 { margin-bottom: 16px; color: var(--brown); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
    .badge-new { background: #ef4444; color: white; font-size: 0.7rem; padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-box">
    <h2 style="color:var(--brown);margin-bottom:8px;">🍫 Admin Login</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:8px;">Enter admin password</p>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button class="btn btn-primary btn-block" id="loginBtn">Login</button>
    <p id="loginError" style="color:#991b1b;margin-top:12px;font-size:0.9rem;display:none;"></p>
  </div>

  <div id="adminApp" style="display:none;">
    <header class="header">
      <div class="container header-inner">
        <a href="/" class="logo">🍫 Brownies Bliss</a>
        <nav>
          <a href="/">← Back to Store</a>
          <button class="cart-btn" id="logoutBtn" style="background:#991b1b;">Logout</button>
        </nav>
      </div>
    </header>

    <div class="admin-wrap">
      <div class="admin-header">
        <h1>Admin Panel</h1>
        <span id="orderCountLabel" style="color:var(--muted);font-size:0.95rem;"></span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="products">Products</button>
      </div>

      <!-- ORDERS PANEL -->
      <div class="panel active" id="ordersPanel">
        <div id="ordersList"></div>
      </div>

      <!-- PRODUCTS PANEL -->
      <div class="panel" id="productsPanel">
        <div class="form-card">
          <h3 id="formTitle">Add New Product</h3>
          <form id="productForm">
            <input type="hidden" id="editId" />
            <div class="form-row">
              <div class="form-group">
                <label>Name *</label>
                <input type="text" id="pName" required placeholder="e.g. Nutella Brownie" />
              </div>
              <div class="form-group">
                <label>Price (Rs.) *</label>
                <input type="number" id="pPrice" required min="0" step="1" placeholder="500" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Category</label>
                <select id="pCategory">
                  <option>Classic</option>
                  <option>Loaded</option>
                  <option>Boxes</option>
                  <option>Special</option>
                </select>
              </div>
              <div class="form-group">
                <label>Stock</label>
                <input type="number" id="pStock" min="0" value="50" />
              </div>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="pDesc" rows="2" placeholder="Short description..."></textarea>
            </div>
            <div style="display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary" id="saveProductBtn">Add Product</button>
              <button type="button" class="btn" id="cancelEditBtn" style="display:none;background:#e5e7eb;">Cancel</button>
            </div>
          </form>
        </div>

        <h3 style="margin-bottom:14px;color:var(--brown);">Current Products</h3>
        <div id="productsList"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_KEY = 'bb_admin_pass';
    let password = localStorage.getItem(ADMIN_KEY) || '';
    let orders = [];
    let products = [];

    // ---- Auth ----
    function checkAuth() {
      if (password) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminApp').style.display = 'block';
        loadOrders();
        loadProducts();
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      password = document.getElementById('passwordInput').value.trim();
      localStorage.setItem(ADMIN_KEY, password);
      // Test by calling API
      fetch('/api/admin/orders', { headers: { 'x-admin-password': password } })
        .then(r => {
          if (r.status === 401) {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginError').textContent = 'Wrong password';
            localStorage.removeItem(ADMIN_KEY);
            password = '';
          } else {
            checkAuth();
          }
        })
        .catch(() => {
          document.getElementById('loginError').style.display = 'block';
          document.getElementById('loginError').textContent = 'Server error';
        });
    });

    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(ADMIN_KEY);
      password = '';
      location.reload();
    });

    // ---- Tabs ----
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');
      });
    });

    // ---- Orders ----
    async function loadOrders() {
      const res = await fetch('/api/admin/orders', {
        headers: { 'x-admin-password': password }
      });
      if (res.status === 401) return location.reload();
      orders = await res.json();
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById('ordersList');
      const pending = orders.filter(o => o.status === 'pending').length;
      document.getElementById('orderCountLabel').textContent =
        `${orders.length} total orders` + (pending ? ` · ${pending} pending` : '');

      if (!orders.length) {
        list.innerHTML = '<div class="empty-state">No orders yet. They will appear here when customers place them.</div>';
        return;
      }

      list.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">#${o.id.slice(0, 8).toUpperCase()} · ${new Date(o.created_at).toLocaleString()}</div>
              <div class="order-customer">${o.customer_name}</div>
              <div class="order-meta">${o.customer_phone}${o.customer_email ? ' · ' + o.customer_email : ''}</div>
              <div class="order-meta">${o.address}${o.city ? ', ' + o.city : ''}</div>
              ${o.notes ? `<div class="order-meta" style="font-style:italic;">Note: ${o.notes}</div>` : ''}
            </div>
            <span class="status-badge status-${o.status}">${o.status.replace(/_/g, ' ')}</span>
          </div>
          <div class="order-items">
            ${o.items.map(i => `${i.product_name} × ${i.quantity}`).join('<br>')}
          </div>
          <div class="order-total">Total: Rs. ${Number(o.total).toLocaleString()}</div>
          <select class="status-select" data-id="${o.id}">
            <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
            <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
            <option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option>
            <option value="out_for_delivery" ${o.status==='out_for_delivery'?'selected':''}>Out for delivery</option>
            <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
          </select>
        </div>
      `).join('');

      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          await fetch(`/api/admin/orders/${sel.dataset.id}/status`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-password': password
            },
            body: JSON.stringify({ status: sel.value })
          });
          loadOrders();
        });
      });
    }

    // ---- Products ----
    async function loadProducts() {
      const res = await fetch('/api/products');
      products = await res.json();
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById('productsList');
      if (!products.length) {
        list.innerHTML = '<div class="empty-state">No products yet.</div>';
        return;
      }
      list.innerHTML = products.map(p => `
        <div class="product-row">
          <div class="product-info">
            <h4>${p.name}</h4>
            <span>${p.category} · Rs. ${p.price.toLocaleString()} · Stock: ${p.stock}</span>
          </div>
          <div class="product-actions">
            <button class="btn-sm btn-edit" data-id="${p.id}">Edit</button>
            <button class="btn-sm btn-delete" data-id="${p.id}">Delete</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => startEdit(+btn.dataset.id));
      });
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteProduct(+btn.dataset.id));
      });
    }

    function startEdit(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('editId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pCategory').value = p.category;
      document.getElementById('pStock').value = p.stock;
      document.getElementById('pDesc').value = p.description || '';
      document.getElementById('formTitle').textContent = 'Edit Product';
      document.getElementById('saveProductBtn').textContent = 'Update Product';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').textContent = 'Add New Product';
      document.getElementById('saveProductBtn').textContent = 'Add Product';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const payload = {
        name: document.getElementById('pName').value.trim(),
        price: Number(document.getElementById('pPrice').value),
        category: document.getElementById('pCategory').value,
        stock: Number(document.getElementById('pStock').value),
        description: document.getElementById('pDesc').value.trim()
      };

      const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': password
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        resetForm();
        loadProducts();
      } else {
        const err = await res.json();
        alert(err.error || 'Failed');
      }
    });

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      const res = await fetch(`/api/admin/products/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-password': password }
      });
      if (res.ok) loadProducts();
      else alert('Failed to delete');
    }

    // Auto-refresh orders every 15 seconds
    setInterval(() => {
      if (password && document.getElementById('ordersPanel').classList.contains('active')) {
        loadOrders();
      }
    }, 15000);

    // Start
    checkAuth();
  </script>
</body>
</html>
